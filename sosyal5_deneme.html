<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sosyal Bilgiler 5 - 2. Dönem 2. Ortak Yazılı Denemesi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg:#e9eef2;
    --paper:#f6fafc;
    --ink:#1a2b33;
    --ink-soft:#4a606b;
    --line:#d2e0e6;
    --brand:#0e7490;
    --brand-soft:#cef0f7;
    --green:#15803d;
    --green-soft:#dcfce7;
    --red:#b91c1c;
    --red-soft:#fee2e2;
    --gold:#0891b2;
    --shadow:0 18px 40px -22px rgba(15,60,75,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:
      radial-gradient(circle at 12% 15%, #e3edf2 0%, transparent 45%),
      radial-gradient(circle at 88% 85%, #d9e9ef 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
    line-height:1.55;
  }
  .wrap{max-width:760px;margin:0 auto}

  header.sheet{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:26px 30px 22px;
    box-shadow:var(--shadow);
    border-bottom:none;
    position:relative;
    overflow:hidden;
  }
  header.sheet::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--brand),#22a3c0,var(--gold));
  }
  .badge{
    display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brand);
    background:var(--brand-soft);padding:5px 12px;border-radius:999px;margin-bottom:12px;
  }
  header.sheet h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:1.7rem;line-height:1.15;
    color:var(--ink);letter-spacing:-.01em;
  }
  header.sheet .sub{color:var(--ink-soft);font-size:.95rem;margin-top:6px;font-weight:600}

  .progress-bar{margin-top:20px;height:9px;background:#dde8ec;border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#3fb3ce);
    border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1)}

  .dots{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .dot{
    width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink-soft);font-size:.74rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:all .18s;user-select:none;
  }
  .dot:hover{border-color:var(--brand);transform:translateY(-2px)}
  .dot.answered{background:var(--brand-soft);border-color:#9bd9e6;color:var(--brand)}
  .dot.current{background:var(--brand);border-color:var(--brand);color:#fff;
    box-shadow:0 4px 12px -3px rgba(14,116,144,.55)}

  main.card{
    background:var(--paper);
    border:1px solid var(--line);
    border-top:1px dashed var(--line);
    border-radius:0 0 20px 20px;
    padding:30px;
    box-shadow:var(--shadow);
    min-height:380px;
    display:flex;flex-direction:column;
  }
  .q-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .q-num{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--brand);line-height:1}
  .q-of{font-size:.85rem;color:var(--ink-soft);font-weight:700}
  .q-text{font-size:1.12rem;font-weight:600;color:var(--ink);margin:10px 0 22px;line-height:1.6}

  .options{display:flex;flex-direction:column;gap:11px;flex:1}
  .opt{
    display:flex;align-items:flex-start;gap:13px;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;cursor:pointer;transition:all .16s;text-align:left;font:inherit;
    color:var(--ink);width:100%;
  }
  .opt:hover:not(.locked){border-color:var(--brand);background:#fbfeff;transform:translateX(3px)}
  .opt .key{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);
    color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;
    font-size:.95rem;transition:all .16s;
  }
  .opt .txt{font-size:1rem;font-weight:600;padding-top:3px}
  .opt.selected{border-color:var(--brand);background:var(--brand-soft)}
  .opt.selected .key{background:var(--brand);color:#fff}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .key{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .key{background:var(--red);color:#fff}
  .opt.locked{cursor:default}

  .explain{
    margin-top:18px;padding:14px 16px;border-radius:12px;
    background:#eef7fb;border:1px solid #c9e6f1;font-size:.95rem;color:#0c3a4a;
    display:none;line-height:1.55;
  }
  .explain.show{display:block;animation:fade .3s ease}
  .explain b{color:var(--brand)}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
  .btn{
    font:inherit;font-weight:800;font-size:1rem;border:none;border-radius:13px;
    padding:13px 24px;cursor:pointer;transition:all .16s;display:flex;align-items:center;gap:8px;
  }
  .btn-prev{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
  .btn-prev:hover:not(:disabled){border-color:var(--ink-soft);color:var(--ink)}
  .btn-prev:disabled{opacity:.4;cursor:not-allowed}
  .btn-next{background:var(--brand);color:#fff;margin-left:auto;
    box-shadow:0 8px 18px -8px rgba(14,116,144,.7)}
  .btn-next:hover{background:#0b6178;transform:translateY(-1px)}

  .result{display:none;text-align:center;padding:20px 10px;flex-direction:column;align-items:center}
  .result.show{display:flex;animation:fade .4s ease}
  .result .emoji{font-size:3.4rem;margin-bottom:8px}
  .result h2{font-family:'Fraunces',serif;font-size:1.7rem;color:var(--ink);margin-bottom:6px}
  .score-ring{
    --p:0; width:150px;height:150px;border-radius:50%;margin:18px auto;
    background:conic-gradient(var(--brand) calc(var(--p)*1%), #dde8ec 0);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .score-ring::after{content:"";position:absolute;inset:14px;background:var(--paper);border-radius:50%}
  .score-ring .inner{position:relative;z-index:1;text-align:center}
  .score-ring .big{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:700;color:var(--brand);line-height:1}
  .score-ring .small{font-size:.8rem;color:var(--ink-soft);font-weight:700}
  .result .line{color:var(--ink-soft);font-size:1.05rem;font-weight:600;margin-top:4px}
  .result-stats{display:flex;gap:14px;margin:20px 0 4px;flex-wrap:wrap;justify-content:center}
  .stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 22px;min-width:90px}
  .stat .n{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700}
  .stat .l{font-size:.78rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
  .stat.ok .n{color:var(--green)} .stat.no .n{color:var(--red)} .stat.empty .n{color:var(--ink-soft)}
  .btn-restart{background:var(--brand);color:#fff;margin-top:24px;
    box-shadow:0 8px 18px -8px rgba(14,116,144,.7)}
  .btn-restart:hover{background:#0b6178;transform:translateY(-1px)}
  .btn-review{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);margin-top:12px}
  .btn-review:hover{border-color:var(--brand);color:var(--brand)}

  .signature{
    position:fixed;right:18px;bottom:14px;width:62px;opacity:.5;
    pointer-events:none;z-index:50;filter:saturate(.9);transition:opacity .3s;
  }
  .signature:hover{opacity:.8}

  footer.note{text-align:center;color:var(--ink-soft);font-size:.82rem;margin-top:22px;font-weight:600;opacity:.7}

  @media(max-width:560px){
    body{padding:16px 10px 70px}
    header.sheet,main.card{padding:22px 18px}
    header.sheet h1{font-size:1.4rem}
    .q-text{font-size:1.05rem}
    .signature{width:50px;right:10px;bottom:10px}
    .btn{padding:12px 18px;font-size:.95rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="sheet">
    <span class="badge">2. Dönem · 2. Ortak Yazılı</span>
    <h1>Sosyal Bilgiler 5 — Deneme Sınavı</h1>
    <div class="sub">Senaryo 1 · 20 Soru · Çoktan Seçmeli</div>
    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
    <div class="dots" id="dots"></div>
  </header>

  <main class="card">
    <div id="quiz">
      <div class="q-head">
        <span class="q-num" id="qnum">1</span>
        <span class="q-of" id="qof">/ 20. soru</span>
      </div>
      <div class="q-text" id="qtext"></div>
      <div class="options" id="opts"></div>
      <div class="explain" id="explain"></div>
      <div class="nav">
        <button class="btn btn-prev" id="prev">&larr; Önceki</button>
        <button class="btn btn-next" id="next">Sonraki &rarr;</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="emoji" id="remoji">🎉</div>
      <h2 id="rtitle">Test Tamamlandı!</h2>
      <div class="score-ring" id="ring"><div class="inner">
        <div class="big" id="rpct">0%</div><div class="small">başarı</div>
      </div></div>
      <div class="line" id="rline"></div>
      <div class="result-stats">
        <div class="stat ok"><div class="n" id="sok">0</div><div class="l">Doğru</div></div>
        <div class="stat no"><div class="n" id="sno">0</div><div class="l">Yanlış</div></div>
        <div class="stat empty"><div class="n" id="sempty">0</div><div class="l">Boş</div></div>
      </div>
      <button class="btn btn-review" id="review">Cevapları İncele</button>
      <button class="btn btn-restart" id="restart">Testi Yeniden Başlat</button>
    </div>
  </main>

  <footer class="note">Cevaplarını işaretledikten sonra açıklamayı görebilir, istediğin soruya geri dönebilirsin.</footer>
</div>

<script>
const QUESTIONS = [{"q": "Sosyal bilgiler öğretmeni, öğrencilerinden \"etkin vatandaşların özelliklerine\" örnekler vermelerini istemiştir. Aşağıdaki öğrencilerden hangisinin verdiği örnek etkin bir vatandaşa ait olamaz?", "o": ["Zeynep: Alışverişlerimden sonra mutlaka fiş veya fatura alırım.", "Burak: Satın aldığım ürünün son kullanma tarihi geçmişse durumu görmezden gelirim.", "Cem: Çevremdeki tarihî eserlerin ve doğal varlıkların korunmasına destek olurum.", "Derya: Ailemde kararlar alınırken düşüncelerimi özgürce ifade ederim."], "a": 1, "e": "Satın alınan bir ürünün hatalı ya da son kullanma tarihinin geçmiş olması durumunda hakkını aramak etkin bir vatandaşın görevidir; görmezden gelmek yanlış bir davranıştır."}, {"q": "Kerem, bisiklet kullanmayı çok iyi bildiği için kask takmak istememektedir. Çağan ise kask takmadan bisiklet kullanmamakta ve bisiklet yolunu kullanmaya özen göstermektedir. Çağan'ın bu davranışı toplum düzenine nasıl bir katkı sağlar?", "o": ["Sadece kendi bisikletinin eskimesini önler.", "Trafik kurallarına ve güvenlik önlemlerine uyarak hem kendi sağlığını hem de toplumun güvenliğini korur.", "Diğer çocukların o yolda bisiklet kullanmasını engeller.", "Çevresindekilere korku vererek bisiklet yollarını boşaltır."], "a": 1, "e": "Kurallara uymak, kask takmak ve bisiklet yolunu kullanmak bireysel bir önlem olmasının yanında toplumsal trafik düzeni ve huzuruna doğrudan katkı sağlar."}, {"q": "Kocaeli'deki bir ortaokulda öğrenciler, sosyal sorumluluk çalışmaları yaparak huzurevi ziyareti ve görme engelliler için kitap seslendirme gibi etkinlikler yapmaktadırlar. Öğrencilerin bu faaliyetlere katılması, etkin vatandaşlık açısından aşağıdakilerden hangisini gösterir?", "o": ["Sadece kendi menfaatlerini düşündüklerini", "Çevresindeki sorunları fark edip toplumsal dayanışmaya ve yardımlaşmaya katkı sağladıklarını", "Okuldan kaçmak için farklı bahaneler aradıklarını", "Boş zamanlarını her zaman teknolojik aletlerle geçirmeyi tercih ettiklerini"], "a": 1, "e": "Gönüllü olarak huzurevi ziyareti ve engellilere destek faaliyetleri yapmak, sorunlara duyarlı etkin vatandaş davranışlarıdır ve toplumsal dayanışmayı güçlendirir."}, {"q": "Samsun'da jandarma ekipleri çocuklara uygulamalı trafik güvenliği eğitimi vermiş; güvenli takip mesafesi, emniyet kemerinin önemi ve trafik ışıklarında nasıl davranılması gerektiğini anlatmıştır. Bu eğitimin toplum düzeni bakımından asıl hedefi aşağıdakilerden hangisidir?", "o": ["Mahalledeki araç sayısını azaltarak yolları tamamen yayalara bırakmak", "Çocukların sadece sürücü belgesi almak için sınava hazırlanmasını sağlamak", "Trafik kurallarını bilen, uymayanları uyaran ve yayalara saygılı etkin vatandaşlar yetiştirmek", "Toplu taşıma kullanımını ülke genelinde tamamen yasaklamak"], "a": 2, "e": "Güvenlik ve trafik eğitimlerinin temel amacı, sadece cezadan kaçan değil, kurallara bilinçli uyan ve karşısındakine saygı duyan etkin vatandaşlar yetiştirmektir."}, {"q": "Yarın çok önemli bir sınavı olan Ayşe, odasında ders çalışmaktadır. Ancak üst kattan gelen yüksek müzik sesi, derse odaklanmasını olumsuz etkilemektedir. Üst komşusunun Ayşe'nin uyarısına \"Ben kendi evimde istediğimi yaparım\" diyerek karşılık vermesi, temel hak ve özgürlükler açısından neden yanlıştır?", "o": ["Müzik dinlemenin sadece gündüz saatlerinde yapılabilecek bir etkinlik olduğunu bilmemesi", "Kendi özgürlüğünü kullanırken başkalarının hakkına saygı göstermemesi ve başkalarının özgürlüğünü kısıtlaması", "Çaldığı müzik türünün Ayşe'nin hoşuna gidecek türden bir müzik olmaması", "Sınav dönemlerinde tüm binalarda müzik dinleme yasağı uygulandığını bilmemesi"], "a": 1, "e": "Özgürlükler sınırsız değildir; bir kişinin özgürlüğü başkasının hakkının başladığı yerde biter. Kendi evinde bile olsa kimse başkasına rahatsızlık veremez."}, {"q": "Anayasa ve uluslararası sözleşmelere göre, çocukların ekonomik sömürüye ve eğitimine zarar verecek, bedensel veya zihinsel gelişimini engelleyecek işlerde çalıştırılması yasaktır. Ancak 13 yaşındaki Ali, ailesi tarafından okula gönderilmeyip ağır şartlarda sanayide çalıştırılmaktadır. Ali'nin yaşadığı bu durum, devletin güvence altına aldığı en temel haklardan hangilerinin ihlal edildiğini gösterir?", "o": ["Seçme ve seçilme hakkı", "Yerleşme ve seyahat özgürlüğü", "Özel hayatın gizliliği hakkı", "Eğitim hakkı ve korunma hakkı"], "a": 3, "e": "Çocukların bedensel ve zihinsel gelişimini engelleyecek işlerde çalıştırılması, onların en temel haklarından olan eğitim ve korunma hakkının doğrudan ihlalidir."}, {"q": "Herkesin devlet sınırları içerisinde yerleşme ve seyahat etme hürriyeti vardır. Ancak koronavirüs salgını döneminde, salgının daha fazla yayılarak vatandaşların hayatını tehdit etmesini engellemek amacıyla bazı köy ve mahalleler geçici süreyle karantinaya alınmıştır. Bu durumdan yola çıkarak aşağıdaki çıkarımlardan hangisi yapılabilir?", "o": ["Seyahat hakkı hiçbir durumda, hiçbir gerekçeyle kısıtlanamaz.", "Toplum sağlığını ve yaşama hakkını korumak gibi olağanüstü durumlarda temel hak ve özgürlükler yasalarla sınırlandırılabilir.", "Salgın hastalıklarda sadece hastalık taşıyanların değil, doktorların da seyahat etmesi yasaktır.", "Karantina uygulaması vatandaşların eğitim ve düşünceyi ifade etme hakkını elinden almaktır."], "a": 1, "e": "Temel haklar anayasa ile korunsa da, bulaşıcı salgın hastalıklar gibi halk sağlığını doğrudan tehdit eden olağanüstü durumlarda devlet tarafından geçici olarak kısıtlanabilir."}, {"q": "Temel insan hak ve özgürlükleri, yasalarla güvence altına alınmıştır ve bu hakların korunmasında en etkili güç devlettir. Devletin temel hakları yasalar ve anayasa ile koruma altına almasının en önemli sebebi aşağıdakilerden hangisidir?", "o": ["Bireylerin toplum içinde kendini daha güvende hissetmesini ve adil bir düzende yaşamasını sağlamak", "Bireylerin istedikleri zaman başkalarına zarar verebilmesine hukuki bir ortam hazırlamak", "Mahkemelerin ve avukatların iş yükünü artırmak", "Toplumda sadece belirli bir grubun ayrıcalıklı ve üstün olmasını sağlamak"], "a": 0, "e": "Devletin insan haklarını kanun güvencesine almasının ana nedeni, adaleti sağlamak ve bireylerin korkusuzca, özgür, güvenli bir şekilde yaşayabileceği toplum düzenini inşa etmektir."}, {"q": "Mersin'de bir mahalle muhtarı, her sabah mahallesindeki sokakları bisikletiyle dolaşarak çöp toplama sorunlarını, yanan veya eksik sokak lambalarını ve asfalt çukurları gibi sorunları not alıp ilgili kurumlara iletmektedir. Muhtarın tespit ettiği çöp toplama, altyapı ve yol onarımı gibi mahalli sorunların çözümü için öncelikle aşağıdaki kurumlardan hangisinin görev alması gerekir?", "o": ["Sağlık Bakanlığı", "Kaymakamlık", "Belediye", "Tüketici Hakem Heyeti"], "a": 2, "e": "Sokak lambaları, asfalt yaması, çöplerin toplanması ve kanalizasyon gibi yerel altyapı hizmetlerini yerine getiren temel kurum Belediyedir."}, {"q": "İbrahim Bey, bir alışveriş sitesinden aldığı elektrikli süpürgenin bozuk çıkması üzerine satıcı firma ile iletişime geçmiş ancak ürünün değişimi firma tarafından haksız yere reddedilmiştir. Bilinçli bir tüketici olan İbrahim Bey, mağduriyetinin giderilmesi ve ödediği paranın iade edilmesi için hangi kuruma başvurmalıdır?", "o": ["Tüketici Hakem Heyeti", "Emniyet Müdürlüğü", "TEMA Vakfı", "Nüfus Müdürlüğü"], "a": 0, "e": "Alışverişlerde hatalı/kusurlu (ayıplı) ürün satan ve iadeyi kabul etmeyen firmalara karşı vatandaşların başvurması gereken en birincil kurum Tüketici Hakem Heyetidir."}, {"q": "Vatandaşların devletle iletişimini kolaylaştırmak amacıyla kurulan; istek, şikâyet, görüş ve öneri gibi durumlar için \"ALO 150\" hattından, posta yoluyla veya internet üzerinden doğrudan başvuru yapılabilen merkez aşağıdakilerden hangisidir?", "o": ["Kamu Denetçiliği Kurumu", "CİMER (Cumhurbaşkanlığı İletişim Merkezi)", "Kızılay", "Yeşilay"], "a": 1, "e": "Vatandaşların devlet makamlarına istek, dilekçe, öneri veya şikayetlerini hızlı şekilde iletebilmeleri için oluşturulan merkez CİMER'dir (ALO 150)."}, {"q": "Ayşe, abilir, temiz bir dünya bırakmak", "Kullanılamayacak durumdaki atıkları toprağa gömerek gizlemek", "Fabrikaların doğadan daha fazla taze ham madde tüketmesini sağlamak"], "a": 1, "e": "Atıkların yeniden değerlendirilerek ekonomiye ve doğaya kazandırılması çöp miktarını azaltır, hammadde tasarrufu sağlar ve gelecek nesillere temiz bir doğa bırakır."}, {"q": "Fosil yakıtlar olan petrol, kömür ve doğal gaz gibi yenilenemeyen enerji kaynaklarının yanması sonucu ortaya çıkan gazlar havayı ısıtarak küresel iklim değişikliğine yol açmaktadır. Evinde doğal gaz ve elektrik gibi kaynakları gereksiz yere kullanmayarak verimli tüketen bir ailenin asıl katkısı aşağıdakilerden hangisidir?", "o": ["Sera gazı salınımını ve çevre kirliliğini azaltarak iklim değişikliğinin yavaşlamasına destek olmak", "Evdeki cihazların kullanım ömrünü erkenden bitirmek", "Fosil yakıtların dünya üzerinde hiç tükenmemesini kesin olarak garantilemek", "Yenilenemeyen enerji kaynaklarına olan talebi artırarak maliyetleri yükseltmek"], "a": 0, "e": "Yenilenemez enerji kaynaklarının tasarruflu tüketilmesi atmosfere salınan zararlı sera gazlarını azaltır, bu da küresel ısınma ile mücadeleye destek olur."}, {"q": "Marketlerde ücretli poşet uygulamasının ardından plastik poşet kullanımı %65 oranında düşmüş, tüketiciler doğa dostu bir adım atarak alışverişlerinde daha çok bez çanta veya file kullanmaya başlamıştır. Bilinçli bir tüketici olarak plastik poşet yerine sürekli bez çanta kullanan Zeynep'in bu davranışı dünyamızı nasıl etkiler?", "o": ["Doğada yüzyıllarca çözünmeyen ve canlılara zarar veren plastik atık miktarının azalmasını sağlar.", "Ülkenin geri dönüşüme yolladığı atık kağıt miktarını hızla artırır.", "Yeni sanayi tesislerinin kurularak sadece plastik üretmesini teşvik eder.", "Suların ve toprağın kimyasal atıklarla daha fazla kirlenmesine neden olur."], "a": 0, "e": "Plastik poşetlerin doğada parçalanması yüzlerce yıl sürer. Bez çanta veya file kullanmak, doğayı kirleten plastik atık üretimini ve tüketimini azaltır."}, {"q": "Beşinci sınıf öğrencisi Emre, bütçesini planlarken mağazada gördüğü, almazsa hayatında büyük bir eksiklik hissetmeyeceği oldukça pahalı bir ayakkabıyı hemen satın almak istemektedir. Ancak bu ayakkabıyı alırsa temel okul ihtiyaçları olan defter ve çalışma kitaplarını alamayacaktır. Bu durumda \"10 Saniye Kuralı\"nı uygulayan bilinçli bir tüketici olarak Emre'nin hangi kararı vermesi gerekir?", "o": ["Ayakkabıya çok ihtiyacı olmadığı hâlde bütçesini zorlayıp hemen ayakkabıyı almalıdır.", "Ayakkabının anlık bir \"istek\", okul malzemelerinin ise bir \"ihtiyaç\" olduğunu fark edip önceliği eğitim ihtiyaçlarına vermelidir.", "Önce ayakkabıyı alıp, daha sonra sınıftaki arkadaşlarından zorla defter ve kalem istemelidir.", "Bütçe planlamasını bırakıp elindeki tüm parasını gereksiz yere harcamalıdır."], "a": 1, "e": "Bir bütçe hazırlanırken istek olan lüks kalemlerden ziyade ihtiyaç olan, eksikliğinde zarar görülecek malzemelere kesinlikle öncelik verilmelidir."}, {"q": "Aylık gelir ve giderlerini dengede tutmaya çalışan Zeynep Hanım, kış aylarının gelmesiyle artacak olan elektrik ve doğal gaz faturası gibi zorunlu masraflar için her ay bütçesinden küçük bir miktar parayı köşeye ayırmaktadır. Zeynep Hanım'ın gelecekteki ya da beklenmedik ihtiyaçları için bugünden kenara para ayırarak yaptığı bu uygulamaya ekonomide ne ad verilir?", "o": ["İstek", "İsraf", "Tasarruf", "Tüketim"], "a": 2, "e": "Bir gelirin belli bir miktarının harcanmayıp, ilerideki beklenmedik zorunluluklar veya gelecekteki ihtiyaçlar için köşeye ayrılması işlemine ekonomi dilinde tasarruf denir."}, {"q": "Pazarda meyve satan Elif, günlük kazancını harcarken gelir-gider takibi yapmamakta ve genellikle son dakika pahalı alışverişler yapmaktadır. Bir süre sonra evini su basıp acil tamirat gerektiğinde, elinde hiç birikimi olmadığı için çok zor durumda kalmıştır. Elif'in karşılaştığı bu ekonomik sıkıntının temel sebebi aşağıdakilerden hangisidir?", "o": ["Hayatında sürekli temel ihtiyaçlarına öncelik vermesi", "Uygulanabilir bir bütçe planı oluşturmaması ve birikim (tasarruf) yapmaması", "Alışverişlerinde ucuz ürünler satın alarak parasını biriktirmesi", "Sadece isteklerini kısıp eğitim masraflarını artırması"], "a": 1, "e": "Elif'in kriz anında çaresiz kalmasının sebebi; kazancını plansız harcaması, öncelik sırası yapmaması ve geliri içinden zor zamanlar için tasarruf etmemesidir."}, {"q": "Hasan, bayramlarda ve haftalık olarak aldığı harçlıkları hemen atıştırmalık gibi anlık isteklere harcamak yerine; önceden planladığı bir deftere gelir ve giderlerini not etmektedir. Ay sonunda ne kadar parası kalacağını hesaplayan Hasan, aylar sonra çok istediği bisikleti kimseye borçlanmadan kendi birikimiyle satın almıştır. Hasan'ın bu davranışı, bütçe yönetimi açısından hangi becerisinin geliştiğini gösterir?", "o": ["Finansal okuryazarlık becerisine sahip olarak kaynaklarını dengeli kullanabildiğini", "Kazandığı paranın tamamını sadece anlık istekleri uğruna bitirdiğini", "Ailesinin bütçesinden sürekli borç alarak sorunlarını çözdüğünü", "Kendi ihtiyaçlarını görmezden gelerek başkalarının parasını yönettiğini"], "a": 0, "e": "Gelir ve giderini hesaplamak, isteklerine ulaşmak için planlı şekilde birikim yapmak bir finansal okuryazarlık becerisi olup, başarılı bir bütçe yöntemidir."}];
const LETTERS = ["A","B","C","D"];
let cur = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const dotsEl = document.getElementById('dots');
const optsEl = document.getElementById('opts');
const explainEl = document.getElementById('explain');

function buildDots(){
  dotsEl.innerHTML = '';
  QUESTIONS.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i+1;
    d.onclick = ()=>{ cur=i; render(); };
    dotsEl.appendChild(d);
  });
}

function render(){
  document.getElementById('quiz').style.display='block';
  document.getElementById('result').classList.remove('show');

  const q = QUESTIONS[cur];
  document.getElementById('qnum').textContent = cur+1;
  document.getElementById('qof').textContent = '/ '+QUESTIONS.length+'. soru';
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('pfill').style.width = ((cur+1)/QUESTIONS.length*100)+'%';

  [...dotsEl.children].forEach((d,i)=>{
    d.className = 'dot';
    if(answers[i]!==null) d.classList.add('answered');
    if(i===cur) d.classList.add('current');
  });

  optsEl.innerHTML='';
  const chosen = answers[cur];
  q.o.forEach((text,i)=>{
    const b = document.createElement('button');
    b.className='opt';
    b.innerHTML = '<span class="key">'+LETTERS[i]+'</span><span class="txt">'+text+'</span>';
    if(chosen!==null){
      b.classList.add('locked');
      if(i===q.a) b.classList.add('correct');
      else if(i===chosen) b.classList.add('wrong');
    }
    b.onclick=()=>{
      if(answers[cur]!==null) return;
      answers[cur]=i;
      render();
    };
    optsEl.appendChild(b);
  });

  if(chosen!==null){
    const ok = chosen===q.a;
    explainEl.innerHTML = (ok?'<b>Doğru!</b> ':'<b>Doğru cevap '+LETTERS[q.a]+'.</b> ')+q.e;
    explainEl.classList.add('show');
  } else {
    explainEl.classList.remove('show');
  }

  document.getElementById('prev').disabled = (cur===0);
  const nextBtn = document.getElementById('next');
  nextBtn.textContent = (cur===QUESTIONS.length-1) ? 'Testi Bitir ✓' : 'Sonraki →';
}

document.getElementById('prev').onclick=()=>{ if(cur>0){cur--;render();} };
document.getElementById('next').onclick=()=>{
  if(cur<QUESTIONS.length-1){ cur++; render(); }
  else { showResult(); }
};

function showResult(){
  let ok=0,no=0,empty=0;
  QUESTIONS.forEach((q,i)=>{
    if(answers[i]===null) empty++;
    else if(answers[i]===q.a) ok++;
    else no++;
  });
  const pct = Math.round(ok/QUESTIONS.length*100);
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').classList.add('show');
  document.getElementById('sok').textContent=ok;
  document.getElementById('sno').textContent=no;
  document.getElementById('sempty').textContent=empty;
  document.getElementById('rpct').textContent=pct+'%';
  document.getElementById('ring').style.setProperty('--p',pct);

  let emoji,title,line;
  if(pct>=85){emoji='🏆';title='Harikasın!';line='Çok başarılı bir sonuç, tebrikler.';}
  else if(pct>=60){emoji='🎉';title='Güzel iş!';line='İyi gidiyorsun, birkaç tekrarla daha da yükselirsin.';}
  else if(pct>=40){emoji='💪';title='Fena değil!';line='Eksik konuları tekrar edersen çok daha iyi olacak.';}
  else {emoji='📚';title='Tekrar zamanı';line='Üzülme, konuları gözden geçirip tekrar dene.';}
  document.getElementById('remoji').textContent=emoji;
  document.getElementById('rtitle').textContent=title;
  document.getElementById('rline').textContent=line;
  document.getElementById('pfill').style.width='100%';
}

document.getElementById('restart').onclick=()=>{
  answers = new Array(QUESTIONS.length).fill(null);
  cur=0; render();
};
document.getElementById('review').onclick=()=>{ cur=0; render(); };

buildDots();
render();
</script>
